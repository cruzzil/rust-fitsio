[package]
authors = ["Simon Walker <s.r.walker101@googlemail.com>"]
categories = ["external-ffi-bindings", "science"]
description = "Rust implmentation of astronomy fits file handling"
documentation = "https://docs.rs/fitsio"
edition = "2018"
homepage = "https://github.com/simonrw/rust-fitsio"
license = "MIT/Apache-2.0"
name = "fitsio"
readme = "README.md"
repository = "https://github.com/simonrw/rust-fitsio"
version = "0.21.10"
rust-version = "1.63.0"

[package.metadata.release]
pre-release-replacements = [
    {file="../README.md", search="fitsio = .*", replace="{{crate_name}} = \"{{version}}\""},
    {file="src/lib.rs", search="https://docs.rs/fitsio/.*", replace="https://docs.rs/fitsio/{{version}}\")]"},
]

[package.metadata.docs.rs]
features = ["array"]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bytemuck = "1.14"
fitsio-sys = { version = "0.5", path = "../fitsio-sys", optional = true }
libc = "0.2.44"
ndarray = { version = "0.17.1", optional = true }
rsfitsio = { version = "0.470.6", optional = true }

[dev-dependencies]
criterion = "0.8.0"
fitsio-derive = { version = "0.2", path = "../fitsio-derive" }
tempfile = "3.0.0"
version-sync = "0.9.0"
# transient dependency for ciborium
serde = "1.0.178"
# transient dependency of quote
proc-macro2 = "1.0.80"

[features]
default = ["cfitsio"]
# Use the C cfitsio library, through `fitsio-sys`
cfitsio = ["dep:fitsio-sys"]
# Use the pure Rust `rsfitsio` port of cfitsio instead of the C library. Mutually exclusive with
# `cfitsio`, so disable default features to use it.
rsfitsio = ["dep:rsfitsio"]
array = ["ndarray"]
bindgen = ["cfitsio", "fitsio-sys?/with-bindgen"]
fitsio-src = ["cfitsio", "fitsio-sys?/fitsio-src"]
src-cmake = ["cfitsio", "fitsio-sys?/src-cmake"]
clippy = []

[[bench]]
harness = false
name = "benchmarks"
